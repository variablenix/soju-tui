name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly UTC verification catches newly disclosed dependency vulnerabilities.
    - cron: "17 10 * * 1"

permissions:
  contents: read

concurrency:
  group: soju-tui-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "The following Go files are not formatted with gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Run tests with race detection
        run: go test -race -count=1 ./...

      - name: Enforce coverage floor
        run: ./scripts/check-coverage.sh

      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...

      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Check shell helpers
        run: shellcheck scripts/*.sh

      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Build static Linux artifacts
        run: ./scripts/build.sh --target all --version ci-${{ github.sha }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soju-tui-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/soju-tui-linux-amd64
            dist/soju-tui-linux-arm64
            dist/SHA256SUMS
            dist/BUILDINFO

  soju-compatibility:
    name: Soju Compatibility
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test real Soju v0.9.0 and v0.10.1 instances
        run: ./scripts/test-soju-compat.sh
